<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company | Hirely</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"></head><body><header id="navbar"></header><main><div class="container section" id="company"></div></main><footer id="footer"></footer><script type="module">import {renderLayout} from "/js/components/layout.js";import {api,qs} from "/js/core/api.js";import {escapeHtml} from "/js/core/ui.js";renderLayout();try{const r=await api.get(`/companies/${encodeURIComponent(qs("slug")||"")}`),c=r.data;document.getElementById("company").innerHTML=`<div class="dashboard-card"><div class="detail-hero"><div class="company-logo">${escapeHtml((c.name||"C").slice(0,1))}</div><div><h1>${escapeHtml(c.name)}</h1><p class="muted-text">${escapeHtml(c.industry||"Company")}</p></div></div><p>${escapeHtml(c.description||"No company description yet.")}</p></div>`}catch(e){document.getElementById("company").innerHTML=`<div class="empty-state">${escapeHtml(e.message)}</div>`}</script></body></html>
