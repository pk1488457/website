<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | Hirely</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"></head><body><header id="navbar"></header><main><section class="page-head"><div class="container"><span class="eyebrow">ACCOUNT</span><h1>Settings</h1><p>Manage your password and account preferences.</p></div></section><section class="container narrow section"><div class="dashboard-card"><form id="passwordForm"><h3>Change password</h3><label>Current password<input class="input" type="password" name="currentPassword" required></label><label>New password<input class="input" type="password" name="newPassword" required minlength="6"></label><button class="btn btn-primary">Update password</button></form></div></section></main><footer id="footer"></footer><script type="module">import {renderLayout} from "/js/components/layout.js";import {api} from "/js/core/api.js";import {toast} from "/js/core/ui.js";renderLayout();document.getElementById("passwordForm").onsubmit=async e=>{e.preventDefault();try{await api.put("/auth/updatepassword",Object.fromEntries(new FormData(e.target)));toast("Password updated")}catch(x){toast(x.message,"error")}}</script></body></html>
