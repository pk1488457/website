<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companies | Hirely</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"></head><body><header id="navbar"></header><main><section class="page-head"><div class="container"><span class="eyebrow">EMPLOYERS</span><h1>Explore companies</h1><p>Discover teams, cultures and open roles.</p></div></section><section class="container section"><div id="companies" class="feature-grid"></div></section></main><footer id="footer"></footer><script type="module">import {renderLayout} from "/js/components/layout.js";import {api} from "/js/core/api.js";import {escapeHtml} from "/js/core/ui.js";renderLayout();try{const r=await api.get("/companies?limit=50");document.getElementById("companies").innerHTML=(r.data||[]).map(c=>`<article class="feature-card"><div class="company-logo">${escapeHtml((c.name||"C").slice(0,1))}</div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.description||"A company hiring through Hirely.")}</p><a class="text-link" href="/company-details.html?slug=${encodeURIComponent(c.slug||"")}">View company →</a></article>`).join("")||'<div class="empty-state">No companies available yet.</div>'}catch(e){document.getElementById("companies").innerHTML=`<div class="empty-state">${escapeHtml(e.message)}</div>`}</script></body></html>
