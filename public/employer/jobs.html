<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Jobs | Hirely</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/components.css"></head><body><header id="navbar"></header><main><section class="page-head"><div class="container page-head-row"><div><span class="eyebrow">EMPLOYER</span><h1>Manage jobs</h1></div><a class="btn btn-primary" href="/employer/post-job.html">Post job</a></div></section><section class="container section"><div id="jobs" class="stack-list"></div></section></main><footer id="footer"></footer><script type="module">import {renderLayout} from "/js/components/layout.js";import {api} from "/js/core/api.js";import {escapeHtml} from "/js/core/ui.js";renderLayout();try{const r=await api.get("/jobs/employer/mine");document.getElementById("jobs").innerHTML=(r.data||[]).map(j=>`<article class="job-card"><div class="job-card-head"><div><h3>${escapeHtml(j.title)}</h3><span class="muted-text">${escapeHtml(j.location?.city||"Remote")} · ${escapeHtml(j.jobType)}</span></div><span class="status">${escapeHtml(j.status)}</span></div><div class="job-actions"><span>${j.applicationsCount||0} applications · ${j.viewsCount||0} views</span><a class="text-link" href="/employer/applicants.html?jobId=${j._id}">Applicants →</a></div></article>`).join("")||'<div class="empty-state">No jobs posted yet.</div>'}catch(e){document.getElementById("jobs").innerHTML=`<div class="empty-state">${escapeHtml(e.message)}</div>`}</script></body></html>
